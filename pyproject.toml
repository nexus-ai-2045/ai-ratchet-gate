[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ratchet-gate"
version = "0.1.0"
description = "trackedかつignoredなGit矛盾の新規増加を止めるラチェット型ゲート"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "nexus-ai-2045"}]
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
ai-ratchet-gate = "ai_ratchet_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
