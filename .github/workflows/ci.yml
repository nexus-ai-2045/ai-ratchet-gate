name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install -e ".[test]"

      - name: Verify with the selected Python
        run: python scripts/verify.py

      - name: Enforce observe→evaluate (built-in adapters)
        run: |
          python scripts/enforce_observe_evaluate.py \
            --adapter git.tracked_ignored \
            --baseline .ai-ratchet-gate/baselines/git.tracked_ignored.v1.json
          python scripts/enforce_observe_evaluate.py \
            --adapter skills.provenance \
            --baseline .ai-ratchet-gate/baselines/skills.provenance.v1.json
          python scripts/enforce_observe_evaluate.py \
            --adapter test.disable \
            --baseline .ai-ratchet-gate/baselines/test.disable.v1.json

      - name: Build and install release artifacts
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -m pip install ".[release]"
          python -m build
          python scripts/check_release_artifacts.py --dist-dir dist
          python scripts/smoke_install_artifacts.py --dist-dir dist
