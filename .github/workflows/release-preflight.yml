name: Release preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: pyproject.tomlとCHANGELOGに記録したversion
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install verification dependencies
        run: python -m pip install -e ".[test,release]"

      - name: Verify release changelog
        run: >-
          python scripts/check_release_changelog.py
          --version "${{ inputs.version }}"
          --require-current-date
          --require-clean-unreleased

      - name: Run tests
        run: python scripts/verify.py

      - name: Build and verify artifacts
        run: |
          python -m build
          python scripts/check_release_artifacts.py --dist-dir dist
          python scripts/smoke_install_artifacts.py --dist-dir dist

      - name: Record SHA-256
        shell: bash
        run: sha256sum dist/*
